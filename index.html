<script id="app-code">
(()=>{'use strict';
const app=document.getElementById('app');const initialBody=document.body.innerHTML;
const QUESTIONS=[
{id:'q1',topic:'1D List',q:'What is a list in Python?',opts:['A way to store several values in one variable','A command that repeats code','A way to print a single number','A comparison between two numbers'],right:0,explain:'A list groups multiple items together in one variable.'},
{id:'q2',topic:'1D List',q:'Which line creates a Python list?',opts:['items = ("key", "coin")','items = ["key", "coin"]','items = {"key": "coin"}','items = "key, coin"'],right:1,explain:'Python lists are created using square brackets [ ].'},
{id:'q3',topic:'1D List',q:'A game uses a list to store the player’s items. Why?',opts:['To delete the game','To keep several items organized','To change the screen size','To stop all player movement'],right:1,explain:'A game inventory can store items such as keys, shields and potions in a list.'},
{id:'q4',topic:'2D List',q:'What is a 2D list?',opts:['One number only','A loop inside a loop','A list containing inner lists','A command to print a result'],right:2,explain:'A 2D list is a list of lists, often shown as a table.'},
{id:'q5',topic:'2D List',q:'Look at board = [[1, 2], [3, 4]]. How many rows are there?',opts:['1','2','3','4'],right:1,explain:'There are two inner lists, so the table has two rows.'},
{id:'q6',topic:'2D List',q:'Using board = [[1, 2], [3, 4]], what is board[1][0]?',opts:['1','2','3','4'],right:2,explain:'Row index 1 is the second row [3, 4]. Column index 0 is its first value: 3.'},
{id:'q7',topic:'3D List',q:'A 3D list can be understood as…',opts:['A list with no brackets','A collection of 2D tables (layers)','A list with only one value','A single column of numbers'],right:1,explain:'A 3D list contains multiple 2D lists, like layers of tables.'},
{id:'q8',topic:'3D List',q:'Which example is a 3D list?',opts:['data = [1, 2]','data = [[1, 2], [3, 4]]','data = [[[1, 2]], [[3, 4]]]','data = 3'],right:2,explain:'The values are inside rows, tables, and an outer list: three levels of lists.'},
{id:'q9',topic:'3D List',q:'Using levels = [[[1, 2]], [[3, 4]]], how many layers are there?',opts:['1','2','3','4'],right:1,explain:'The outer list contains two 2D lists, so there are two layers.'}
];
const TASKS=[
{id:'c1',label:'Create a 1D List',icon:'🎒',difficulty:'Beginner',prompt:'Create a Python list called items with any THREE game items. Then print the list.',hints:['Use square brackets [ ]','Put a comma between items','Strings (words) need quotation marks','End with print(items)']},
{id:'c2',label:'Create a 2D List',icon:'🧮',difficulty:'Beginner',prompt:'Create a 2D list called board with TWO rows and THREE numbers in each row. Then print the list.',hints:['A 2D list is a list inside a list','Make two inner lists: one for each row','Put three numbers in each inner list','End with print(board)']},
{id:'c3',label:'Create a 3D List',icon:'🧊',difficulty:'Easy',prompt:'Create a 3D list called levels with TWO layers. Each layer should have TWO rows and TWO numbers in each row. Then print the list.',hints:['Imagine two tables stacked as layers','Each layer is a 2D list','Each layer contains two inner lists (rows)','End with print(levels)']}
];
const st={screen:'home',demo:false,mode:'',pin:'',name:'',uid:'',student:null,students:{},grades:{},selectedUid:'',current:0,task:0,config:window.APP_FIREBASE_CONFIG||null,auth:null,db:null,fb:null,unsub:[],editing:false, busy:false};
const byId=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// standalone key-based local persistence (works in modern browsers; demo also works without storage)
function saveLS(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){}}
function readLS(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch(e){return null}}
function note(text,kind=''){return `<div class="note ${kind}">${text}</div>`}
function flash(msg,kind='success'){let el=byId('notice');if(el){el.innerHTML=note(esc(msg),kind);el.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function role(role){st.mode=role;byId('mode-chip').textContent=role==='teacher'?'👩‍🏫 Teacher dashboard':role==='student'?'🎮 Student activity':'👩‍🏫 Teacher + Student'}
function render(){byId('home-btn').onclick=()=>{stopSubs();st.screen='home';role('');render()}; if(st.screen==='home')home();if(st.screen==='setup')setup();if(st.screen==='teacher')teacher();if(st.screen==='join')join();if(st.screen==='student')student();}
function home(){app.innerHTML=`<section class="hero"><span class="chip">✨ A LIVE CLASSROOM GAME</span><h1>Python Lists <span>Challenge</span></h1><p>Review lists, explore 2D and 3D lists, answer 9 multiple-choice questions, and write 3 short Python programs. Your teacher can watch answers as students submit them.</p><div class="actions"><button class="btn primary" id="teach">👩‍🏫 Teacher — Start Class</button><button class="btn pink" id="learner">🎮 Student — Join with PIN</button><button class="btn" id="preview">👀 Try Offline Demo</button></div></section><div class="cards"><div class="card"><div class="emoji">📝</div><h3>9 Multiple-choice Questions</h3><p>Simple revision on 1D, 2D and 3D lists. See each student’s exact selected answer.</p></div><div class="card"><div class="emoji">💻</div><h3>3 Write-the-Code Tasks</h3><p>Students create a list, a 2D list and a 3D list. View drafts, submissions and teacher marks.</p></div><div class="card"><div class="emoji">📊</div><h3>Teacher Live Board</h3><p>Names, correct/wrong totals, chosen answers, saved Python code and a CSV export.</p></div></div><div class="space"></div>${!st.config?note('<b>Live sharing requires setup:</b> connect a free Firebase project once, then upload the configured index.html to a website. You can explore the offline demo immediately.','warn'):note('<b>Firebase configuration is included.</b> Create a teacher room or join a classroom.','success')}`;
byId('teach').onclick=()=>{st.demo=false;role('teacher');st.screen='setup';render()};byId('learner').onclick=()=>{st.demo=false;role('student');st.screen='join';render()};byId('preview').onclick=()=>{st.demo=true;st.pin='DEMO';st.students=readLS('listlab-demo')||st.demoStudents||{};st.grades=readLS('listlab-grades')||st.demoGrades||{};st.screen='teacher';role('teacher');render()};}
function setup(){const resumed=readLS('listlab-teacherpin');app.innerHTML=`<div class="setup"><div class="between"><h1 class="sectiontitle">👩‍🏫 Teacher — Live Room</h1><span class="chip">${st.config?'🟢 Configuration ready':'🟠 Needs Firebase setup'}</span></div>${st.config?`<div class="panel"><h2>Start the classroom</h2><p class="muted">Create a 6-digit PIN that your students will use to join. Live updates need internet and the configured website.</p><div class="actions"><button id="create-room" class="btn primary">🚀 Create New Live Class</button>${resumed?`<button class="btn" id="resume-room">↩ Resume Room ${esc(resumed)}</button>`:''}<button class="btn quiet" id="reset-config">⚙ Change Firebase Setup</button></div><div id="notice"></div></div>`:''}
<div class="space"></div><div class="panel"><h2>⚙ One-time Firebase connection</h2><p class="muted">For students on different devices, the answers need an online database. Paste your Firebase web app configuration here once. Then download the configured website file and upload it to GitHub Pages or another HTTPS website.</p><label class="field"><span>Firebase configuration (paste the object from Firebase Console)</span><textarea id="config-text" spellcheck="false" placeholder='const firebaseConfig = {\n  apiKey: "...",\n  authDomain: "...",\n  databaseURL: "https://...",\n  projectId: "...",\n  appId: "..."\n};'></textarea></label><div class="actions"><button class="btn primary" id="save-config">💾 Use this configuration</button><button class="btn" id="download-config" ${st.config?'':'disabled'}>⬇ Download Configured index.html</button><a class="btn quiet" href="https://console.firebase.google.com/" target="_blank" rel="noopener">Open Firebase Console ↗</a></div><div class="space"></div>${note('Please enable <b>Authentication → Anonymous</b> and <b>Realtime Database</b>, then publish the security rules from <b>firebase-rules.json</b>. Do not use open/public database rules.','warn')}<p class="tiny">Config is kept in this browser while testing. Download the configured index.html so the students’ shared website also knows how to connect. The file has no teacher password or private API key; access is controlled by Firebase rules.</p><div id="config-notice"></div></div></div>`;
byId('save-config').onclick=()=>{try{const parsed=parseFirebase(byId('config-text').value);st.config=parsed;saveLS('listlab-config',parsed);setup();byId('config-text').value=JSON.stringify(parsed,null,2);byId('config-notice').innerHTML=note('Configuration saved! Download the configured index.html and upload it as your website.','success')}catch(e){byId('config-notice').innerHTML=note(esc(e.message),'error')}};
byId('download-config').onclick=()=>downloadConfigured();if(byId('create-room'))byId('create-room').onclick=()=>createRoom();if(byId('resume-room'))byId('resume-room').onclick=()=>resumeRoom(resumed);if(byId('reset-config'))byId('reset-config').onclick=()=>{st.config=null;saveLS('listlab-config',null);setup()};}
function parseFirebase(src){let t=src.trim();if(!t)throw Error('Paste the Firebase config first.');let i=t.indexOf('{'),j=t.lastIndexOf('}');if(i<0||j<i)throw Error('Please paste a Firebase configuration object.');t=t.slice(i,j+1).replace(/([,{]\s*)([a-zA-Z_$][\w$]*)\s*:/g,'$1"$2":').replace(/,\s*}/g,'}');let x=JSON.parse(t);for(let k of ['apiKey','authDomain','databaseURL','projectId','appId'])if(!x[k])throw Error('Missing '+k+' in Firebase configuration.');return x}
function downloadConfigured(){if(!st.config)return;const doc=document.documentElement.cloneNode(true);doc.querySelector('#fb-config').textContent='window.APP_FIREBASE_CONFIG = '+JSON.stringify(st.config).replace(/</g,'\\u003c')+';';doc.querySelector('body').innerHTML=initialBody;const html='<!DOCTYPE html>\n'+doc.outerHTML;download('index.html',html,'text/html;charset=utf-8');const n=byId('config-notice');if(n)n.innerHTML=note('Downloaded! This copy contains your Firebase settings and is ready to host.','success')}
function download(filename,data,type='text/plain'){const blob=new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function getFirebase(){if(st.fb&&st.auth&&st.db)return st.fb;if(!st.config){const saved=readLS('listlab-config');if(saved)st.config=saved}if(!st.config)throw Error('Firebase is not configured. Please open Teacher Setup.');const V='13.1.0',g='https://www.gstatic.com/firebasejs/'+V+'/';const [apps,auth,database]=await Promise.all([import(g+'firebase-app.js'),import(g+'firebase-auth.js'),import(g+'firebase-database.js')]);const fbApp=apps.initializeApp(st.config);st.auth=auth.getAuth(fbApp);st.db=database.getDatabase(fbApp);if(!st.auth.currentUser)await auth.signInAnonymously(st.auth);st.uid=st.auth.currentUser.uid;st.fb={...database};return st.fb}
function stopSubs(){st.unsub.forEach(f=>{try{f()}catch(e){}});st.unsub=[]}
function busy(id,flag){const el=byId(id);if(el){el.disabled=flag;el.textContent=flag?'Connecting…':el.dataset.orig||el.textContent}}
async function createRoom(){const b=byId('create-room');b.dataset.orig=b.textContent;busy('create-room',true);try{const f=await getFirebase();let pin='';let created=false;for(let attempt=0;attempt<7;attempt++){pin=String(Math.floor(100000+Math.random()*900000));try{await f.set(f.ref(st.db,'rooms/'+pin),{ownerUid:st.uid,createdAt:Date.now()});created=true;break}catch(e){if(e.code!=='PERMISSION_DENIED'&&e.code!=='permission-denied')throw e}}if(!created)throw Error('Could not find an unused PIN. Try again.');saveLS('listlab-teacherpin',pin);st.pin=pin;st.students={};st.grades={};st.screen='teacher';teacherSubscribe();render()}catch(e){flash('Could not create class: '+e.message,'error');busy('create-room',false)}}
async function resumeRoom(pin){try{const f=await getFirebase();const owner=await f.get(f.ref(st.db,'rooms/'+pin+'/ownerUid'));if(!owner.exists()||owner.val()!==st.uid)throw Error('Teacher login is different. Please create a new room from this browser.');st.pin=pin;st.screen='teacher';teacherSubscribe();render()}catch(e){flash(e.message,'error')}}
function teacherSubscribe(){if(st.demo)return;stopSubs();const f=st.fb;st.unsub.push(f.onValue(f.ref(st.db,'rooms/'+st.pin+'/students'),s=>{st.students=s.val()||{};if(st.screen==='teacher')teacher()},e=>{if(st.screen==='teacher')flash('Students update error: '+e.message,'error')}));st.unsub.push(f.onValue(f.ref(st.db,'rooms/'+st.pin+'/grades'),s=>{st.grades=s.val()||{};if(st.screen==='teacher')teacher()},e=>{if(st.screen==='teacher')flash('Marks update error: '+e.message,'error')}))}
function join(){const auto=new URLSearchParams(location.search).get('pin')||'';app.innerHTML=`<div class="setup"><div class="panel"><h1 class="sectiontitle">🎮 Join Your Classroom</h1><p class="muted">Type the 6-digit PIN from your teacher and your first name. You will answer 9 questions and write 3 short Python programs.</p><label class="field"><span>Class PIN</span><input id="join-pin" inputmode="numeric" maxlength="6" placeholder="e.g. 123456" value="${esc(auto)}"></label><label class="field"><span>Your name</span><input id="join-name" maxlength="50" placeholder="e.g. Sara A."></label><button class="btn primary wide" id="join-start">Join & Start ▶</button><div id="notice"></div></div></div>`;byId('join-start').onclick=()=>joinLive()}
async function joinLive(){let pin=byId('join-pin').value.trim();const name=byId('join-name').value.trim();if(!/^\d{6}$/.test(pin))return flash('Please enter a valid six-digit PIN.','error');if(name.length<2)return flash('Please enter your name.','error');const b=byId('join-start');b.dataset.orig=b.textContent;busy('join-start',true);try{const f=await getFirebase();const owner=await f.get(f.ref(st.db,'rooms/'+pin+'/ownerUid'));if(!owner.exists())throw Error('This class PIN was not found. Check with your teacher.');if(owner.val()===st.uid)throw Error('This browser belongs to the teacher. Join using another browser/device for student mode.');st.pin=pin;st.name=name;st.screen='student';st.current=0;st.task=0;st.view='quiz';st.student={name,answers:{},codes:{}};await f.set(f.ref(st.db,`rooms/${pin}/students/${st.uid}/name`),name);studentSubscribe();render()}catch(e){flash('Cannot join: '+e.message,'error');busy('join-start',false)}}
function studentSubscribe(){if(st.demo)return;stopSubs();const f=st.fb;st.unsub.push(f.onValue(f.ref(st.db,`rooms/${st.pin}/students/${st.uid}`),s=>{st.student=s.val()||{name:st.name,answers:{},codes:{}};if(st.screen==='student'&&!st.editing)student()},()=>{}));st.unsub.push(f.onValue(f.ref(st.db,`rooms/${st.pin}/grades/${st.uid}`),s=>{st.myGrades=s.val()||{};if(st.screen==='student'&&!st.editing)student()},()=>{}))}
function beginDemoStudent(){st.demo=true;st.pin='DEMO';st.name='Student Demo';st.uid='demo-student';st.student=st.students[st.uid]||{name:st.name,answers:{},codes:{}};st.screen='student';st.current=0;st.task=0;st.view='quiz';role('student');render()}
async function saveAnswer(q,choice){const ans={choice:String(choice),at:Date.now()};st.student=st.student||{name:st.name,answers:{},codes:{}};st.student.answers=st.student.answers||{};st.student.answers[q.id]=ans;if(st.demo){st.students[st.uid]=st.student;st.demoStudents=st.students;saveLS('listlab-demo',st.students)}else{try{await st.fb.set(st.fb.ref(st.db,`rooms/${st.pin}/students/${st.uid}/answers/${q.id}`),ans)}catch(e){flash('Answer not saved: '+e.message,'error')}}student()}
let typeTimer=null;async function saveCode(task,submit){const editor=byId('code-editor');if(!editor)return;const code=editor.value.slice(0,4900);const item={text:code,submitted:!!submit,at:Date.now()};st.student.codes=st.student.codes||{};st.student.codes[task.id]=item;if(st.demo){st.students[st.uid]=st.student;st.demoStudents=st.students;saveLS('listlab-demo',st.students)}else{try{await st.fb.set(st.fb.ref(st.db,`rooms/${st.pin}/students/${st.uid}/codes/${task.id}`),item)}catch(e){flash('Code could not be saved: '+e.message,'error');return}}if(submit){st.editing=false;student();flash('Your code was sent to the teacher for review!','success')}}
function student(){role('student');const s=st.student||{name:st.name,answers:{},codes:{}};const answers=s.answers||{};const codes=s.codes||{};const answered=QUESTIONS.filter(q=>answers[q.id]).length;const submitted=TASKS.filter(t=>codes[t.id]?.submitted).length;const total=QUESTIONS.length+TASKS.length;const index=st.current;app.innerHTML=`<div class="between stickyhead"><div><span class="chip">👋 ${esc(s.name||st.name)} · PIN ${esc(st.pin)}</span><div class="tiny" style="margin-top:8px">Your progress: ${answered+submitted} / ${total} activities</div></div><span class="chip">${st.demo?'🧪 Demo mode':'🟢 Connected to class'}</span></div><div class="progress"><div style="width:${(answered+submitted)/total*100}%"></div></div><div class="space"></div><div class="tabs"><button class="tab ${st.view!=='code'?'active':''}" id="quiz-tab">🧠 Multiple Choice (${answered}/9)</button><button class="tab ${st.view==='code'?'active':''}" id="code-tab">💻 Write Python (${submitted}/3)</button></div><div id="student-content"></div><div id="notice"></div>`;byId('quiz-tab').onclick=()=>{st.view='quiz';st.editing=false;student()};byId('code-tab').onclick=()=>{st.view='code';st.editing=false;student()};if(st.view==='code')studentCodes();else studentQuiz()}
function studentQuiz(){const q=QUESTIONS[st.current];const a=st.student?.answers?.[q.id];const saved=a?Number(a.choice):-1;const feedback=a?`<div class="space"></div>${note(saved===q.right?'✅ Correct! '+esc(q.explain):'❌ Not quite. '+esc(q.explain),saved===q.right?'success':'error')}`:'';byId('student-content').innerHTML=`<div class="panel"><div class="between"><div class="chip">Question ${st.current+1} of 9</div><span class="flowbadge">${q.topic}</span></div><div class="bigQ">${esc(q.q)}</div><div class="choices">${q.opts.map((op,i)=>`<button class="choice ${saved===i?'picked':''} ${a&&saved===i?(saved===q.right?'right':'wrong'):''}" data-opt="${i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(op)}</span></button>`).join('')}</div>${feedback}<div class="space"></div><div class="between"><button id="prev-q" class="btn" ${st.current===0?'disabled':''}>← Previous</button><div class="pills">${QUESTIONS.map((x,i)=>`<button class="pill" style="cursor:pointer;${st.current===i?'border-color:#54dbff':''}" data-jump="${i}">${i+1}${st.student?.answers?.[x.id]?'✓':''}</button>`).join('')}</div><button id="next-q" class="btn primary">${st.current===8?'💻 Code Challenges →':'Next →'}</button></div></div>`;
byId('student-content').querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>saveAnswer(q,Number(b.dataset.opt)));byId('student-content').querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{st.current=Number(b.dataset.jump);student()});byId('prev-q').onclick=()=>{st.current=Math.max(0,st.current-1);student()};byId('next-q').onclick=()=>{if(st.current===8)st.view='code';else st.current++;student()}}
function studentCodes(){const task=TASKS[st.task];const saved=st.student?.codes?.[task.id];const verdict=(st.demo?st.grades[st.uid]:st.myGrades||{})?.[task.id];byId('student-content').innerHTML=`<div class="panel"><div class="between"><span class="chip">${esc(task.icon)} Code Challenge ${st.task+1} / 3</span><span class="chip">${task.difficulty}</span></div><h2 class="sectiontitle">${esc(task.label)}</h2><p class="bigQ" style="font-size:22px">${esc(task.prompt)}</p>${note('<b>Hints:</b><br>'+task.hints.map((h,i)=>(i+1)+'. '+esc(h)).join('<br>'))}<div class="space"></div><label class="field"><span>Write Python code here (not executed in the browser)</span><textarea class="code" id="code-editor" spellcheck="false" maxlength="4900" placeholder="# Type your Python code here">${esc(saved?.text||'')}</textarea></label><div class="between"><span class="tiny" id="code-status">${saved?.submitted?'✅ Sent to teacher':'Write code, then click Submit'}</span><button id="submit-code" class="btn primary">📨 Submit Code to Teacher</button></div>${verdict?`<div class="space"></div>${note('Teacher review: '+(verdict==='correct'?'✅ Correct':verdict==='incorrect'?'❌ Needs correction':'Under review'),verdict==='correct'?'success':verdict==='incorrect'?'error':'')}`:''}<div class="space"></div><div class="between"><button class="btn" id="prev-code" ${st.task===0?'disabled':''}>← Previous task</button><div class="pills">${TASKS.map((t,i)=>`<button class="pill" data-task="${i}" style="cursor:pointer;${i===st.task?'border-color:#50dbff':''}">${i+1}${st.student?.codes?.[t.id]?.submitted?'✓':''}</button>`).join('')}</div><button class="btn" id="next-code">${st.task===2?'🔁 Back to Quiz':'Next task →'}</button></div></div>`;const ed=byId('code-editor');ed.addEventListener('input',()=>{st.editing=true;byId('code-status').textContent='Typing… autosaves a draft';clearTimeout(typeTimer);typeTimer=setTimeout(async()=>{await saveCode(task,false);byId('code-status')&&(byId('code-status').textContent='Draft saved ✓')},850)});byId('submit-code').onclick=async()=>{clearTimeout(typeTimer);if(ed.value.trim().length<5){byId('code-status').textContent='Please type your code first';return}await saveCode(task,true)};byId('prev-code').onclick=()=>{clearTimeout(typeTimer);st.task=Math.max(0,st.task-1);st.editing=false;student()};byId('next-code').onclick=()=>{clearTimeout(typeTimer);if(st.task===2){st.view='quiz';st.current=0}else st.task++;st.editing=false;student()};byId('student-content').querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{clearTimeout(typeTimer);st.task=Number(b.dataset.task);st.editing=false;student()})}
function teacher(){role('teacher');const students=Object.entries(st.students||{}).map(([uid,s])=>({uid,s:s||{}})).sort((a,b)=>(a.s.name||'').localeCompare(b.s.name||''));const allAnswers=students.flatMap(x=>QUESTIONS.filter(q=>x.s.answers?.[q.id]).map(q=>({q,chosen:Number(x.s.answers[q.id].choice)})));const correct=allAnswers.filter(x=>x.chosen===x.q.right).length;const wrong=allAnswers.length-correct;const submitted=students.reduce((sum,x)=>sum+TASKS.filter(t=>x.s.codes?.[t.id]?.submitted).length,0);const grades=st.grades||{};const reviewed=students.reduce((sum,x)=>sum+TASKS.filter(t=>['correct','incorrect'].includes(grades[x.uid]?.[t.id])).length,0);const root=location.protocol==='file:'?'':location.origin+location.pathname;const link=root?root+'?pin='+st.pin:'';
const qr=!st.demo&&link?`<img class="qr" alt="Scan to join class" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(link)}" onerror="this.style.display='none'">`:'';
app.innerHTML=`<section class="hero" style="padding:24px"><div class="between"><div><span class="chip">${st.demo?'🧪 OFFLINE DEMO — NOT SHARED':'🟢 LIVE CLASSROOM'} · Grade 9</span><h1 style="font-size:32px;margin:12px 0">Teacher <span>Dashboard</span></h1><div class="muted">See students’ answers and code as they submit.</div></div><div class="center">${st.demo?'<div class="sharepin">DEMO</div>':'<div class="tiny">STUDENT JOIN PIN</div><div class="sharepin">'+esc(st.pin)+'</div>'}</div>${qr}</div><div class="space"></div><div class="actions">${st.demo?'<button class="btn primary" id="demo-student">🎮 Play as Demo Student</button><button class="btn" id="demo-clear">↺ Clear Demo Results</button>':`<button class="btn primary" id="copy-link" ${link?'':'disabled'}>📋 Copy Student Link</button><button class="btn" id="csv">⬇ Export Answers CSV</button><button class="btn" id="share-link" ${link?'':'disabled'}>🔗 Open Student Link</button>`}</div>${!st.demo&&!link?`<div class="space"></div>${note('To use different devices, upload the configured index.html to an HTTPS website such as GitHub Pages. A file:// address cannot be shared.','warn')}`:''}<div id="notice"></div></section><div class="statgrid"><div class="stat"><b>${students.length}</b><small>Students joined</small></div><div class="stat"><b>${allAnswers.length}</b><small>MCQ responses</small></div><div class="stat"><b class="ok">${correct}</b><small>Correct</small></div><div class="stat"><b class="no">${wrong}</b><small>Wrong</small></div><div class="stat"><b>${submitted}<span class="tiny"> / ${students.length*3}</span></b><small>Code submissions · ${reviewed} reviewed</small></div></div><div class="grid2 teachgrid"><section class="panel"><div class="between"><h2>👥 Students</h2><span class="tiny">Click a name</span></div>${students.length?`<div class="tablewrap"><table><thead><tr><th>Name</th><th>✓</th><th>✗</th><th>MCQ</th><th>Code</th></tr></thead><tbody>${students.map(x=>{const as=x.s.answers||{};const list=QUESTIONS.filter(q=>as[q.id]);const c=list.filter(q=>Number(as[q.id].choice)===q.right).length;const code=TASKS.filter(t=>x.s.codes?.[t.id]?.submitted).length;return `<tr data-student="${esc(x.uid)}" class="${st.selectedUid===x.uid?'selected':''}"><td><b>${esc(x.s.name||'Student')}</b></td><td class="ok">${c}</td><td class="no">${list.length-c}</td><td>${list.length}/9</td><td>${code}/3</td></tr>`}).join('')}</tbody></table></div>`:note(st.demo?'Click “Play as Demo Student” to submit answers and see them appear here.':'Waiting for students to join using the class PIN.','warn')}</section><section class="panel" id="detail-panel"><h2>🔎 Individual Answers</h2>${students.length?studentDetail(st.selectedUid&&st.students[st.selectedUid]?st.selectedUid:students[0].uid):'<p class="muted">Student choices and Python code will appear here.</p>'}</section></div><div class="space"></div><section class="panel"><h2>📈 Question-by-Question Overview</h2><div class="tablewrap"><table><thead><tr><th>#</th><th>Topic</th><th>Answered</th><th>Correct</th><th>Wrong</th></tr></thead><tbody>${QUESTIONS.map((q,i)=>{const ans=students.map(x=>x.s.answers?.[q.id]).filter(Boolean);const c=ans.filter(a=>Number(a.choice)===q.right).length;return `<tr><td>${i+1}</td><td>${esc(q.topic)}</td><td>${ans.length}</td><td class="ok">${c}</td><td class="no">${ans.length-c}</td></tr>`}).join('')}</tbody></table></div></section>`;
if(st.demo){byId('demo-student').onclick=()=>beginDemoStudent();byId('demo-clear').onclick=()=>{st.students={};st.grades={};st.demoStudents={};st.demoGrades={};saveLS('listlab-demo',{});saveLS('listlab-grades',{});teacher()}}else{byId('copy-link').onclick=async()=>{try{await navigator.clipboard.writeText(link);flash('Student link copied. Share it in Teams or Classera!','success')}catch(e){flash('Copy this address: '+link,'warn')}};byId('share-link').onclick=()=>window.open(link,'_blank','noopener');byId('csv').onclick=exportCSV}
app.querySelectorAll('[data-student]').forEach(r=>r.onclick=()=>{st.selectedUid=r.dataset.student;teacher()});app.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>markCode(b.dataset.studentid,b.dataset.taskid,b.dataset.grade));}
function studentDetail(uid){const s=st.students[uid]||{};const as=s.answers||{};const co=s.codes||{};const myGrades=st.grades[uid]||{};return `<div class="between"><h3 style="color:var(--blue)">${esc(s.name||'Student')}</h3><span class="tiny">9 MCQ + 3 coding tasks</span></div><h3 style="margin-top:17px">🧠 Selected Answers</h3>${QUESTIONS.map((q,i)=>{const ans=as[q.id];const idx=ans?Number(ans.choice):-1;const valid=idx===q.right;return `<div class="answerline"><b>Q${i+1}.</b> ${esc(q.q)}<div class="optionlabel">${ans?`Student chose: <b class="${valid?'ok':'no'}">${'ABCD'[idx]||'?'} — ${esc(q.opts[idx]||'?')}</b>`:'<span class="pending">Not answered yet</span>'}</div>${ans?`<div class="tiny">${valid?'✅ Correct':'❌ Wrong'} · Correct answer: ${'ABCD'[q.right]} — ${esc(q.opts[q.right])}</div>`:''}</div>`}).join('')}<h3 style="margin-top:20px">💻 Submitted Python Code</h3>${TASKS.map(t=>{const c=co[t.id];const v=myGrades[t.id];return `<div class="codeblock"><div class="between"><h3>${esc(t.icon)} ${esc(t.label)}</h3><span class="chip">${v==='correct'?'✅ Correct':v==='incorrect'?'❌ Incorrect':c?.submitted?'🟡 Needs marking':c?.text?'✍️ Draft':'⌛ Not started'}</span></div><p class="callout">${esc(t.prompt)}</p>${c?.text?`<pre class="codeview">${esc(c.text)}</pre>`:'<p class="muted sm">No code yet.</p>'}${c?.submitted?`<div class="actions"><button class="btn goodbtn" data-grade="correct" data-studentid="${esc(uid)}" data-taskid="${t.id}">✓ Mark Correct</button><button class="btn badbtn" data-grade="incorrect" data-studentid="${esc(uid)}" data-taskid="${t.id}">✗ Mark Incorrect</button><button class="btn quiet" data-grade="review" data-studentid="${esc(uid)}" data-taskid="${t.id}">↺ Needs Review</button></div>`:''}</div>`}).join('')}`}
async function markCode(uid,task,grade){if(st.demo){st.grades[uid]=st.grades[uid]||{};st.grades[uid][task]=grade;st.demoGrades=st.grades;saveLS('listlab-grades',st.grades);teacher();return}try{await st.fb.set(st.fb.ref(st.db,`rooms/${st.pin}/grades/${uid}/${task}`),grade);st.selectedUid=uid;teacher()}catch(e){flash('Mark not saved: '+e.message,'error')}}
function exportCSV(){const rows=[['Student','Question','Topic','Question text','Selected answer / code','Correct answer','Status']];Object.entries(st.students).forEach(([uid,s])=>{QUESTIONS.forEach((q,i)=>{const a=s.answers?.[q.id];const ix=a?Number(a.choice):-1;rows.push([s.name||'Student','Q'+(i+1),q.topic,q.q,ix<0?'':`${'ABCD'[ix]} - ${q.opts[ix]}`,`${'ABCD'[q.right]} - ${q.opts[q.right]}`,ix<0?'Not answered':ix===q.right?'Correct':'Wrong'])});TASKS.forEach((t,i)=>{const c=s.codes?.[t.id];const v=st.grades[uid]?.[t.id];rows.push([s.name||'Student','Code '+(i+1),t.label,t.prompt,c?.text||'','Teacher review',!c?.submitted?'Not submitted':v==='correct'?'Correct':v==='incorrect'?'Incorrect':'Needs review'])})});const cell=x=>{let s=String(x??'');if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const csv='\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n');download('Grade9_List_Lab_Results_'+st.pin+'.csv',csv,'text/csv;charset=utf-8')}
// Read a locally configured project after the teacher has pasted config in this browser.
if(!st.config)st.config=readLS('listlab-config');
render();
})();
</script></body></html>
